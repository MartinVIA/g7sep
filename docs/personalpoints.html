<!DOCTYPE html>
<html>
  <head>
    <title>Personal Points - Cloverville</title>
    <link href="styles.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="img/leaveicon.png">
  </head>
  <body>
    <img src="img/-2.jpeg" class="side-banner side-banner-left" alt="Left Banner">
    <img src="img/moestuin-1444x963-jpg-crop.jpeg" class="side-banner side-banner-right" alt="Right Banner">
    <h3>Personal Points in Cloverville</h3>
    <p>Here you can find information about your personal points and how to earn them through completing tasks and participating in community activities!</p>

    <div style="display: flex; justify-content: center; align-items: center; width: 100%;">
      <div id="points-list" class="table-container"></div>
    </div>

    <div id="points-status" style="font-size:0.9em;color:#444;margin-bottom:8px;"></div>

    <!-- Boost Status Modal -->
    <div id="boost-modal" class="modal" style="display:none;">
      <div class="modal-content" style="width:100px;height:100px;padding:10px;text-align:center;">
        <span class="close" style="position:absolute;top:2px;right:8px;font-size:16px;">&times;</span>
        <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;">
          <div id="modal-boost-status" style="font-size:12px;font-weight:bold;"></div>
        </div>
      </div>
    </div>

    <script src="funcs.js"></script>
    <script src="load_json.js"></script>
  </body>
</html>
